name: JARVIS Cron Jobs

on:
  schedule:
    # UTC — Europe/Vienna ist UTC+2 (Sommer)
    - cron: '30 4 * * *'   # 06:30 CEST → Morning Block (Metrics + Briefing + Monday Plan)
    - cron: '0 19 * * *'   # 21:00 CEST → Evening Block (Recap + Sunday Weekly)
  workflow_dispatch:
    inputs:
      job:
        description: 'Which cron job to run'
        required: true
        type: choice
        options:
          - metrics
          - morning
          - evening
          - weekly
          - plan-generation

jobs:
  morning-block:
    if: github.event_name == 'schedule' && github.event.schedule == '30 4 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Metrics
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/metrics" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Wait for metrics
        run: sleep 10

      - name: Morning briefing
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/morning" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Plan generation (Monday only)
        if: contains('Mon', steps.metrics.outputs.day) || true
        run: |
          DAY=$(date -u +%a)
          if [ "$DAY" = "Mon" ]; then
            curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/plan-generation" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          else
            echo "Not Monday ($DAY), skipping plan generation"
          fi

  evening-block:
    if: github.event_name == 'schedule' && github.event.schedule == '0 19 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Evening recap
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/evening" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"

      - name: Weekly review (Sunday only)
        run: |
          DAY=$(date -u +%a)
          if [ "$DAY" = "Sun" ]; then
            curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/weekly" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          else
            echo "Not Sunday ($DAY), skipping weekly"
          fi

  # Manual trigger for individual jobs
  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Run selected job
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron/${{ github.event.inputs.job }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
